[package]
name = "oob-agent"
version = "0.1.0"
edition = "2021"
description = "Remote OOB agent: dials out to TCS and relays Redfish BMC operations"
license = "Apache-2.0"

[[bin]]
name = "oob-agent"
path = "src/main.rs"

[dependencies]
# Reuse TCS's BMC (Redfish) client + tunnel frame types.
talos-control-system = { path = "../backend" }

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
