[package]
name = "talos-control-system"
version = "0.5.37"
edition = "2021"
description = "Talos Control System - Kubernetes Management Platform"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["ws", "json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }

tokio = { version = "1", features = ["full"] }
tonic = "0.12"
talos-rust-client = { path = "../vendor/talos-rust-client", features = ["talosconfig"] }
tower = "0.4"
prost = "0.13"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
rpassword = "5"
moka = { version = "0.12", features = ["future"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
crc32fast = "1"
flate2 = "1"
fastrand = "2"
aes-gcm = "0.10"
sha2 = "0.10"
prometheus = "0.13"
jsonwebtoken = "9"
oauth2 = "4"
openidconnect = "3"
rsa = "0.9"
ecdsa = "0.16"
utoipa = { version = "4", features = ["axum_extras"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rust-embed = { version = "8", features = ["include-exclude"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
bytes = "1"
futures = "0.3"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
indexmap = { version = "2", features = ["serde"] }
dashmap = "6"
config = "0.14"
kube = { version = "0.94", features = ["rustls-tls", "ws"] }
k8s-openapi = { version = "0.22", features = ["v1_30"] }
serde_yaml = "0.9"
# CLI (kubectl-like `tcs` client)
dirs = "5"
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-native-roots"] }
urlencoding = "2"
async-trait = "0.1"
portable-pty = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
lazy_static = "1"
regex = "1"

# Auth
argon2 = "0.5"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }

# TLS / Certificates
acme2 = "0.5"
openssl = { version = "0.10", features = ["vendored"] }
rcgen = { version = "0.14", features = ["pem", "zeroize"] }
x509-parser = "0.18"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustls-pemfile = "2"
time = "0.3"

# DNS providers
cloudflare = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
http = "1"
url = "2"
tempfile = "3"
# Metal provisioning
dhcproto = "0.12"
socket2 = { version = "0.5", features = ["all"] }

[build-dependencies]
tonic-build = "0.12"
