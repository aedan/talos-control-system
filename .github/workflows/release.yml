name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-musl

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: ./frontend

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            gcc-aarch64-linux-gnu \
            aarch64-linux-gnu-gcc

      - name: Build binary (release)
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: ./backend

      - name: Package artifact
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCH=${{ matrix.arch }}
          BIN=backend/target/${{ matrix.target }}/release/talos-control-system
          STAGING=release-tcs-${VERSION}-${ARCH}

          mkdir -p "$STAGING"
          cp "$BIN" "$STAGING/tcs"
          cp config.example.toml "$STAGING/"

          tar czf "tcs-${VERSION}-linux-${ARCH}.tar.gz" "$STAGING"
          rm -rf "$STAGING"

      - name: Create self-extracting installer
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCH=${{ matrix.arch }}

          # Replace version placeholder in template
          sed "s/VERSION_PLACEHOLDER/${VERSION}/" install.sh.template > "tcs-${VERSION}-linux-${ARCH}.sh"

          # Append the tar.gz payload to the shell script
          cat "tcs-${VERSION}-linux-${ARCH}.tar.gz" >> "tcs-${VERSION}-linux-${ARCH}.sh"
          chmod +x "tcs-${VERSION}-linux-${ARCH}.sh"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tcs-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
            tcs-${{ github.ref_name }}-linux-${{ matrix.arch }}.sh
          generate_release_notes: true
