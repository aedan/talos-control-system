name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (x86_64-linux, glibc 2.35 compat)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libsqlite3-dev pkg-config

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add x86_64-unknown-linux-gnu
          echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV
          echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-22.04-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-22.04-cargo-registry-

      - name: Cache cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-22.04-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-22.04-cargo-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: backend/target
          key: ${{ runner.os }}-22.04-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-22.04-cargo-target-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build metadata
        id: meta
        run: |
          echo "git_hash=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -m1 '^version = ' backend/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend (embedded UI)
        working-directory: backend
        env:
          GIT_HASH: ${{ steps.meta.outputs.git_hash }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          cargo clean
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package self-extracting installer
        run: |
          mkdir -p dist
          cp backend/target/x86_64-unknown-linux-gnu/release/talos-control-system dist/tcs
          chmod +x dist/tcs
          cp config.example.toml dist/
          ./scripts/package-installer.sh \
            --binary dist/tcs \
            --version "${{ steps.meta.outputs.version }}" \
            --commit "${{ steps.meta.outputs.git_hash }}" \
            --arch x86_64 \
            --out dist
          tar czf dist/tcs-${{ steps.meta.outputs.version }}-linux-x86_64.tar.gz \
            -C dist tcs config.example.toml
          ls -lh dist/

      - name: Upload artifact (PR & main)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tcs-release
          path: |
            dist/tcs-*-linux-x86_64.sh
            dist/tcs-*-linux-x86_64.tar.gz
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            dist/tcs-*-linux-x86_64.sh \
            dist/tcs-*-linux-x86_64.tar.gz \
            --generate-notes
