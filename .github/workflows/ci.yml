name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-ci-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ci-cargo-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install + check
        working-directory: frontend
        run: |
          npm ci
          # Generates .svelte-kit/tsconfig.json required by svelte-check
          npx svelte-kit sync
          npm run check

      - name: Backend unit tests
        working-directory: backend
        env:
          # Skip embedded frontend rebuild if present; build.rs still ok without UI
          CARGO_TERM_COLOR: always
        run: cargo test --lib

      - name: Backend cargo check
        working-directory: backend
        run: cargo check
