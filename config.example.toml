# Talos Control System - Example Configuration
# Copy to config.toml. Env vars with prefix TCS_ override (e.g. TCS_SERVER_HTTP_PORT).

[server]
bind_addr = "0.0.0.0"
advertised_url = ""
grpc_port = 8080          # reserved; outbound Talos uses node :50000
http_port = 8081
metrics_port = 9090

[database]
# Alpha: only "sqlite" is supported. "postgres" will refuse to start.
backend = "sqlite"
sqlite_path = "/var/lib/tcs/data.db"
postgres_url = ""
max_connections = 10
connection_timeout = 30

[auth]
# REQUIRED in production. Generate with: openssl rand -hex 32
# Lab only: TCS_ALLOW_INSECURE=1 allows the built-in default.
jwt_secret = "change-me-to-a-long-random-string"

# Optional LDAP / OIDC — see docs/AUTH.md
# [auth.ldap]
# [auth.oidc]

[siderolink]
# Not implemented in alpha (config reserved for future discovery).
bind_port = 8082
listen_port = 443
mtu = 1420
subnet = "100.64.0.0/10"
rate_limit_bytes = 0

[branding]
name = "Talos Control System"
short_name = "TCS"
tagline = "Kubernetes Management Simplified"
primary_color = "#150D6A"
secondary_color = "#4F8BFF"
background_color = "#0A0A0A"
surface_color = "#1A1A1A"
text_color = "#FFFFFF"
text_muted_color = "#A0A0A0"
font_family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
logo_path = ""
favicon_path = ""
docs_url = ""
support_url = ""

# [tls]
# enabled = false
# mode = "disabled"  # disabled | self_signed | provided | letsencrypt
