# Talos Control System - Example Configuration
# Copy to config.toml. Env vars with prefix TCS_ override (e.g. TCS_SERVER_HTTP_PORT).

[server]
bind_addr = "0.0.0.0"
advertised_url = ""
grpc_port = 8080          # reserved; outbound Talos uses node :50000
http_port = 8081
metrics_port = 9090

[database]
# "sqlite" (default) or "postgres" (alpha, dual-backend runtime)
backend = "sqlite"
sqlite_path = "/var/lib/tcs/data.db"
postgres_url = ""
max_connections = 10
connection_timeout = 30

[auth]
# REQUIRED in production. Generate with: openssl rand -hex 32
# Lab only: TCS_ALLOW_INSECURE=1 allows the built-in default.
jwt_secret = "change-me-to-a-long-random-string"

# Optional LDAP / OIDC — see docs/AUTH.md
#
# [auth.ldap]
# url = "ldaps://ad.example.com:636"
# bind_dn = "CN=tcs-svc,OU=Service Accounts,DC=example,DC=com"
# bind_password = "redacted"
# user_search_base = "OU=Users,DC=example,DC=com"
# user_search_filter = "(sAMAccountName={0})"
# default_role = "reader"
# [[auth.ldap.group_role_mappings]]
# group_dn_pattern = "CN=TCS-Admins*"
# role = "admin"
#
# [auth.oidc]
# enabled = true
# issuer_url = "https://login.example.com/"
# client_id = "tcs"
# client_secret = "redacted"
# redirect_url = "https://tcs.example.com/api/auth/oidc/callback"
# scopes = ["openid", "email", "profile"]
# default_role = "reader"

[siderolink]
# WireGuard control-plane: manages host WG iface (tcs-sl0) and hands registering
# nodes their tunnel peer config. Needs wireguard-tools + root for the tunnel
# (inventory-only mode works without it). See docs/SIDEROLINK.md.
bind_port = 8082
listen_port = 443
mtu = 1420
subnet = "100.64.0.0/10"
rate_limit_bytes = 0

[factory]
# Talos Image Factory (builds installer images bundling the module set).
base_url = "https://factory.talos.dev"
registry = "factory.talos.dev"

[branding]
name = "Talos Control System"
short_name = "TCS"
tagline = "Kubernetes Management Simplified"
primary_color = "#150D6A"
secondary_color = "#4F8BFF"
background_color = "#0A0A0A"
surface_color = "#1A1A1A"
text_color = "#FFFFFF"
text_muted_color = "#A0A0A0"
font_family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
logo_path = ""
favicon_path = ""
docs_url = ""
support_url = ""

# TLS — disabled by default (HTTP-only on http_port)
# [tls]
# enabled = true
# mode = "disabled"  # disabled | self_signed | provided | letsencrypt
#
# [tls.letsencrypt]
# domains = ["tcs.example.com"]
# email = "admin@example.com"
# challenge_type = "http-01"
#
# [tls.letsencrypt.dns_provider]
# provider = "cloudflare"
# api_token = "your-token"
# zone_id = "your-zone"
#
# [tls.self-signed]
# domains = ["localhost", "tcs.local"]
#
# [tls.provided]
# cert_path = "/etc/tls/cert.pem"
# key_path = "/etc/tls/key.pem"
# ca_path = "/etc/tls/ca.pem"   # optional CA chain

# Bare-metal: full DHCP + PXE + BMC (off by default — use a dedicated provision VLAN)
# [metal]
# enabled = true
# [metal.dhcp]
# enabled = true
# interface = "eth1"
# bind_ip = "10.88.0.1"         # optional; else interface primary
# subnet = "10.88.0.0/24"
# range_start = "10.88.0.100"
# range_end = "10.88.0.200"
# gateway = "10.88.0.1"
# dns = ["10.88.0.1"]
# lease_ttl_secs = 3600
# allow_unknown = false
# [metal.pxe]
# enabled = true
# http_port = 6969
# tftp_enabled = false   # serve iPXE chainloaders (undionly.kpxe/snponly.efi) over TFTP for legacy PXE
# asset_dir = "/var/lib/tcs/pxe"
# default_talos_version = "v1.13.7"
# mirror_base = "https://github.com/siderolabs/talos/releases/download"
# extra_cmdline = ""
# ipxe_bios_file = "undionly.kpxe"
# ipxe_uefi_file = "snponly.efi"
# [metal.bmc]
# connect_timeout_secs = 15
# prefer_redfish = true
# ipmi_interface = "lanplus"
