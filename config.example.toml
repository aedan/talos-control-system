# Talos Control System - Example Configuration
# Copy to config.toml. Env vars with prefix TCS_ override (e.g. TCS_SERVER_HTTP_PORT).

[server]
# TCS always listens on :80 (HTTP → redirect / ACME) and :443 (HTTPS).
# There is no separate http_port — 80/443 are the only listeners.
bind_addr = "0.0.0.0"
advertised_url = ""          # e.g. "https://tcs.example.com" — used for Siderolink + cert SAN
grpc_port = 8080             # reserved; outbound Talos uses node :50000
metrics_port = 9090          # reserved

[database]
# "sqlite" (default) or "postgres" (alpha, dual-backend runtime)
backend = "sqlite"
sqlite_path = "/var/lib/tcs/data.db"
postgres_url = ""
max_connections = 10
connection_timeout = 30

[auth]
# Bootstrap only. First start copies this into the database vault and then
# removes the line. Do not leave a client secret or bind password here.
# Lab only: TCS_ALLOW_INSECURE=1 allows the built-in default.
jwt_secret = "change-me-to-a-long-random-string"

# LDAP, OIDC, and SAML are saved from Settings → Authentication into the database.
# Passwords and client secrets go in the vault (`tcs vault put`). See docs/AUTH.md.

[siderolink]
# WireGuard control-plane: manages host WG iface (tcs-sl0) and hands registering
# nodes their tunnel peer config. Needs wireguard-tools + root for the tunnel
# (inventory-only mode works without it). See docs/SIDEROLINK.md.
bind_port = 8082
listen_port = 443
mtu = 1420
# IPv4 address placed on the WireGuard interface: the first host of this
# CIDR, with the same prefix. Default 100.64.0.0/10 → 100.64.0.1/10.
# Set to "" to add no IPv4 address (IPv6 ULA only).
subnet = "100.64.0.0/10"
rate_limit_bytes = 0

[factory]
# Talos Image Factory (builds installer images bundling the module set).
base_url = "https://factory.talos.dev"
registry = "factory.talos.dev"

[branding]
name = "Talos Control System"
short_name = "TCS"
tagline = "Kubernetes Management Simplified"
primary_color = "#150D6A"
secondary_color = "#4F8BFF"
background_color = "#0A0A0A"
surface_color = "#1A1A1A"
text_color = "#FFFFFF"
text_muted_color = "#A0A0A0"
font_family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
logo_path = ""
favicon_path = ""
docs_url = ""
support_url = ""

# Certificates are saved from Settings → Certificates into the database.
# DNS credentials go in the vault. With no saved settings, TCS serves a
# self-signed certificate. See docs/TLS.md.

# Metal DHCP, PXE, and BMC are saved from Settings → Metal / PXE into the
# database. Off until enabled there. Use a dedicated provision VLAN. See docs/METAL.md.
