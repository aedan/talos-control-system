<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#150D6A" />
    <link rel="icon" type="image/svg+xml" href="/branding/favicon.svg" />
    <title>TCS</title>
    <style>
      :root {
        --tcs-primary: #150D6A;
        --tcs-secondary: #4F8BFF;
        --tcs-background: #0A0A0A;
        --tcs-surface: #1A1A1A;
        --tcs-surface-hover: #252525;
        --tcs-text: #FFFFFF;
        --tcs-text-muted: #A0A0A0;
        --tcs-border: #333333;
        --tcs-error: #EF4444;
        --tcs-font: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
      }
      body {
        margin: 0;
        font-family: var(--tcs-font);
        background: var(--tcs-background);
        color: var(--tcs-text);
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
