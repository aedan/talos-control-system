[package]
edition = "2021"
rust-version = "1.75"
name = "talos-rust-client"
version = "0.1.4"
authors = ["Nuditech Team"]
build = "build.rs"
exclude = ["vendor/"]
autolib = false
autobins = false
autoexamples = false
autotests = false
