# -- Docker image settings
image:
  repository: ghcr.io/siderolabs/talos-control-system
  tag: "0.1.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

# -- Kubernetes service
service:
  type: ClusterIP
  port: 8081
  grpcPort: 8080
  siderolinkPort: 8082
  metricsPort: 9090

# -- Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: tcs.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: tcs-tls
    #   hosts:
    #     - tcs.example.com

# -- Persistent storage
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  existingClaim: ""

# -- Database configuration
database:
  backend: sqlite
  sqlitePath: /var/lib/tcs/data.db
  postgresUrl: ""
  maxConnections: 10
  connectionTimeout: 30

# -- White-label branding defaults
branding:
  name: Talos Control System
  shortName: TCS
  tagline: Kubernetes Management Simplified
  primaryColor: "#150D6A"
  secondaryColor: "#4F8BFF"
  backgroundColor: "#0A0A0A"
  surfaceColor: "#1A1A1A"
  textColor: "#FFFFFF"
  textMutedColor: "#A0A0A0"
  fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"

# -- Siderolink tunnel configuration
siderolink:
  bindPort: 8082
  listenPort: 443
  mtu: 1420
  subnet: "100.64.0.0/10"
  rateLimitBytes: 0

# -- Resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 2000m
    memory: 4Gi

# -- Replica count
replicaCount: 1

# -- Pod security context
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# -- Liveness and readiness probes
probes:
  liveness:
    enabled: true
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    enabled: true
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 10

# -- Node affinity and tolerations
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# -- Additional environment variables
extraEnv: []
  # - name: TCS_DATABASE_BACKEND
  #   value: postgres

# -- Pod annotations
podAnnotations: {}

# -- Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Network policy
networkPolicy:
  enabled: false
