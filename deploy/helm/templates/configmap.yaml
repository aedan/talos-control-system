apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tcs.fullname" . }}
  labels:
    {{- include "tcs.labels" . | nindent 4 }}
data:
  config.toml: |
    [server]
    bind_addr = "0.0.0.0"
    http_port = {{ .Values.service.port }}
    grpc_port = {{ .Values.service.grpcPort }}
    metrics_port = {{ .Values.service.metricsPort }}

    [database]
    backend = {{ .Values.database.backend | quote }}
    sqlite_path = {{ .Values.database.sqlitePath | quote }}
    {{- if .Values.database.postgresUrl }}
    postgres_url = {{ .Values.database.postgresUrl | quote }}
    {{- end }}
    max_connections = {{ .Values.database.maxConnections }}
    connection_timeout = {{ .Values.database.connectionTimeout }}

    [siderolink]
    bind_port = {{ .Values.siderolink.bindPort }}
    listen_port = {{ .Values.siderolink.listenPort }}
    mtu = {{ .Values.siderolink.mtu }}
    subnet = {{ .Values.siderolink.subnet | quote }}
    {{- if gt (int .Values.siderolink.rateLimitBytes) 0 }}
    rate_limit_bytes = {{ .Values.siderolink.rateLimitBytes }}
    {{- end }}

    [branding]
    name = {{ .Values.branding.name | quote }}
    short_name = {{ .Values.branding.shortName | quote }}
    tagline = {{ .Values.branding.tagline | quote }}
    primary_color = {{ .Values.branding.primaryColor | quote }}
    secondary_color = {{ .Values.branding.secondaryColor | quote }}
    background_color = {{ .Values.branding.backgroundColor | quote }}
    surface_color = {{ .Values.branding.surfaceColor | quote }}
    text_color = {{ .Values.branding.textColor | quote }}
    text_muted_color = {{ .Values.branding.textMutedColor | quote }}
    font_family = {{ .Values.branding.fontFamily | quote }}
